# Dev override: Vite hot reload + FastAPI backend
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    container_name: tma-postgres
    environment:
      POSTGRES_USER: ${TEAMMEETINGAI_PG_USER:-tma}
      POSTGRES_PASSWORD: ${TEAMMEETINGAI_PG_PASSWORD:?set TEAMMEETINGAI_PG_PASSWORD in .env}
      POSTGRES_DB: ${TEAMMEETINGAI_PG_DB:-teammeetingai}
    ports:
      - "${TEAMMEETINGAI_PG_PORT:-5433}:5432"
    volumes:
      - tma-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEAMMEETINGAI_PG_USER:-tma} -d ${TEAMMEETINGAI_PG_DB:-teammeetingai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tma-server
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${TEAMMEETINGAI_PG_USER:-tma}:${TEAMMEETINGAI_PG_PASSWORD:?set TEAMMEETINGAI_PG_PASSWORD in .env}@db:5432/${TEAMMEETINGAI_PG_DB:-teammeetingai}
      TEAMMEETINGAI_API_HOST: 0.0.0.0
      TEAMMEETINGAI_API_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TEAMMEETINGAI_API_PORT:-8000}:8000"
    restart: unless-stopped

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://server:8000
    ports:
      - "${TEAMMEETINGAI_CLIENT_PORT:-5173}:5173"
    depends_on:
      - server

volumes:
  tma-pgdata:
