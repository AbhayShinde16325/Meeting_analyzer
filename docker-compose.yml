# TeamMeetingAI: Postgres + unified FastAPI server serving React client
# Usage:
#   cp .env.example .env  # fill required values
#   docker compose up --build
#
# App: http://localhost:${TEAMMEETINGAI_APP_PORT:-8000}

services:
  db:
    image: postgres:16-alpine
    container_name: tma-postgres
    environment:
      POSTGRES_USER: ${TEAMMEETINGAI_PG_USER:-tma}
      POSTGRES_PASSWORD: ${TEAMMEETINGAI_PG_PASSWORD:?set TEAMMEETINGAI_PG_PASSWORD in .env}
      POSTGRES_DB: ${TEAMMEETINGAI_PG_DB:-teammeetingai}
    ports:
      - "${TEAMMEETINGAI_PG_PORT:-5433}:5432"
    volumes:
      - tma-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEAMMEETINGAI_PG_USER:-tma} -d ${TEAMMEETINGAI_PG_DB:-teammeetingai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: tma-app
    env_file:
      - .env
    environment:
      # Default local-dev DB. For shared Supabase, set DATABASE_URL in .env to the
      # same Supabase connection string used by Task Manager and remove/override this.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${TEAMMEETINGAI_PG_USER:-tma}:${TEAMMEETINGAI_PG_PASSWORD:?set TEAMMEETINGAI_PG_PASSWORD in .env}@db:5432/${TEAMMEETINGAI_PG_DB:-teammeetingai}}
      TEAMMEETINGAI_API_HOST: 0.0.0.0
      TEAMMEETINGAI_API_PORT: 8000
      TEAMMEETINGAI_STATIC_DIR: /app/client-dist
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TEAMMEETINGAI_APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  tma-pgdata:
