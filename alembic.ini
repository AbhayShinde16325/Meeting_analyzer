# Alembic configuration for TeamMeetingAI.
#
# The database URL is read from the environment (TEAMMEETINGAI_DATABASE_URL or
# DATABASE_URL) by db/migrations/env.py; secrets must not live in this file.

[alembic]
script_location = db/migrations
prepend_sys_path = .

# Version table name is left default (alembic_version).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
